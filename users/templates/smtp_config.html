{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">SMTP Configuration</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">SMTP Host</label>
                <input type="text" class="form-control" name="host" value="{{ smtp.host|default:'' }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">SMTP Port</label>
                <input type="number" class="form-control" name="port" value="{{ smtp.port|default:'587' }}" required>
            </div>

            <div class="col-md-6 form-check mt-4">
                <input type="checkbox" class="form-check-input" name="use_tls" id="use_tls" {% if smtp.use_tls %}checked{% endif %}>
                <label class="form-check-label" for="use_tls">Use TLS</label>
            </div>

            <div class="col-md-6">
                <label class="form-label">Username (Email)</label>
                <input type="email" class="form-control" name="username" value="{{ smtp.username|default:'' }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" value="{{ smtp.password|default:'' }}" required>
            </div>

            <div class="col-md-6 form-check mt-4">
                <input type="checkbox" class="form-check-input" name="active" id="active" {% if smtp.active %}checked{% endif %}>
                <label class="form-check-label" for="active">Active</label>
            </div>

        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Configuration</button>
        </div>
    </form>
</div>
{% endblock %}
